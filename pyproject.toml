[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "portal-backend"
version = "0.1.0"
description = "Portal Platform Backend API and Celery Worker"
readme = "README.md"
requires-python = "==3.14.8"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "sqlalchemy==2.0.35",
    "celery==5.4.0",
    "redis==5.0.8",
    "passlib==1.7.4",
    "argon2-cffi==23.1.0",
    "bcrypt==4.2.0",
    "python-multipart==0.0.12",
    "httpx==0.27.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "ruff==0.6.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 88
target-version = "py314"
